# Настройки отслеживания цен.
# Править можно прямо на GitHub (значок карандаша) — после сохранения
# проверка запустится сама, и новые настройки применятся через пару минут.

origin: MOW            # Москва: Шереметьево, Домодедово, Внуково, Жуковский

# Окно поездки: вылет не раньше start, возвращение не позже end
period:
  start: 2027-01-30
  end: 2027-03-14

# Сколько ночей на курорте (можно переопределить у курорта ниже)
nights: [7, 8]

# Даты конференции. Поездки, которые задевают эти даты, тоже отслеживаются
# и видны на сайте серым, но уведомлений по ним нет.
# Когда даты станут известны — поменяйте from/to.
low_priority:
  - from: 2027-02-08
    to: 2027-02-21
    label: конференция

direct_only: true      # только прямые рейсы

# threshold — порог в рублях: туда-обратно на 1 взрослого вместе с багажом.
# Как только лучшая цена станет не выше порога, придёт уведомление.
# Пусто — порог не задан.
resorts:
  - id: polyana
    name: Красная Поляна
    airports: [AER]
    nights: [8]            # 8 ночей, как и для Кавказа
    threshold:

  - id: caucasus
    name: Эльбрус · Домбай · Архыз
    airports: [MRV, NAL]   # можно прилететь в один аэропорт, а улететь из другого
    nights: [8]            # 8 ночей, чтобы успеть на два курорта
    threshold:

  - id: sheregesh
    name: Шерегеш
    airports: [NOZ, KEJ]
    threshold:

  - id: khibiny
    name: Хибины
    airports: [KVK, MMK]
    threshold:

  - id: manzherok
    name: Манжерок
    airports: [RGK]
    threshold:

  - id: gorny
    name: Горный воздух
    airports: [UUS]
    threshold:

# Оценка доплаты за один комплект лыж или сноуборда (до 23 кг),
# ₽ за перелёт в одну сторону. В кэше Aviasales почти всегда лежит
# самый дешёвый тариф — без багажа, поэтому к нему прибавляется эта сумма.
# Это прикидка, а не точная цена авиакомпании.
baggage:
  default: 2000
  airlines:
    SU: 2000   # Аэрофлот: лыжи бесплатно до 15.05.2027, но только на тарифах с багажом
    FV: 2000   # Россия — та же акция
    HZ: 2000   # Аврора — та же акция
    DP: 2500   # Победа: провоз снаряжения всегда платный
    S7: 2500   # S7: на тарифе «Эконом Basic» доплата от 2500 ₽
    U6: 2000   # Уральские авиалинии: бесплатно, кроме тарифа «Промо»
    UT: 2000   # ЮТэйр
    5N: 2000   # Smartavia

alerts:
  new_min_step_percent: 1   # «новый минимум» — если дешевле прежнего хотя бы на 1%
  drop_percent: 5           # «заметное снижение» — на 5% ниже минимума за последние сутки
  digest_hour: 8            # утренняя сводка, час по Москве
  quiet_hours: [23, 8]      # с 23:00 до 8:00 сообщения приходят без звука

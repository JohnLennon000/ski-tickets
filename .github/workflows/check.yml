name: Проверка цен.

on:
  schedule:
    # Каждые 30 минут. Утренняя сводка уходит с первой проверкой после 8:00 по Москве.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      digest:
        description: "Прислать сводку сейчас"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [config.yaml, "push/**"]   # новые настройки или подключённый телефон — проверить сразу

permissions:
  contents: write

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Проверить цены
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
        run: python -m tracker ${{ inputs.digest && '--force-digest' || '' }}

      - name: Сохранить историю цен
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in docs/data state push; do
            if [ -e "$path" ]; then git add -A -- "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git commit -q -m "Цены $(date -u +'%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3; do
            if git push -q origin HEAD:main; then exit 0; fi
            git fetch -q --depth=50 origin main
            git rebase -q origin/main || { git rebase --abort; exit 1; }
          done
          exit 1

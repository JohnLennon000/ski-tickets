name: Проба сайтов авиакомпаний

# Ручной запуск: открывает сайты авиакомпаний через телефон (Tailscale) и сохраняет скриншоты в probe/.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установить браузер
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Подключиться к телефону (Tailscale)
        if: env.TS_AUTHKEY != ''
        continue-on-error: true
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: ski-tickets-probe

      - name: Пустить интернет через телефон
        if: env.TS_AUTHKEY != ''
        continue-on-error: true
        run: |
          node=$(tailscale status --json | python3 -c 'import json,sys
          d=json.load(sys.stdin)
          print(next((p["TailscaleIPs"][0] for p in (d.get("Peer") or {}).values() if p.get("ExitNodeOption") and p.get("Online")), ""))')
          if [ -z "$node" ]; then
            echo "::warning::Телефон не в сети или не разрешён как выходной узел — проба идёт напрямую"
            exit 0
          fi
          sudo tailscale set --exit-node="$node"
          echo "Страна выхода: $(curl -s -m 15 https://ipinfo.io/country || echo '?')"

      - name: Открыть сайты авиакомпаний
        continue-on-error: true
        run: |
          mkdir -p probe
          curl -s -m 15 https://ipinfo.io/json > probe/exit.json || true
          python tools/probe_airlines.py probe

      - name: Сохранить результат
        if: always()
        run: |
          if [ -n "$TS_AUTHKEY" ]; then sudo tailscale set --exit-node= 2>/dev/null || true; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A probe
          git diff --cached --quiet && exit 0
          git commit -q -m "Проба сайтов авиакомпаний $(date -u +'%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3; do
            git push -q origin HEAD:main && exit 0
            git fetch -q --depth=50 origin main
            git rebase -q origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
